<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MoeGuard 油猴版 · 本地仿真台</title>
<style>
  html, body { margin: 0; background: #313338; color: #ddd; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  main { padding: 16px 20px; }
  ul { list-style: none; padding: 0; }
  li { margin-bottom: 12px; }
  img { max-width: 320px; border-radius: 6px; }
  #composer { margin-top: 12px; padding: 8px; background: #383a40; border-radius: 6px; min-height: 24px; }
</style>
</head>
<body>
<main>
  <h3>仿真 Discord 消息流</h3>
  <ul data-list-id="chat-messages">
    <li><img id="moeimg" width="320" alt="待解码" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></li>
    <li><img id="rawimg" width="320" alt="右键菜单目标" src="https://cdn.discordapp.com/attachments/1/2/notfound.png"></li>
  </ul>
  <div id="composer" role="textbox" class="slateTextArea" contenteditable="true">hello</div>
  <!-- 外服表情判据源: 一条渲染成字面文本 (不可用), 一条渲染成图 (可用) -->
  <div class="messageContent_harness" id="litbox"><span>:bad_emote:</span></div>
  <div class="messageContent_harness" id="litbox2"><span>:bad_emote2:</span></div>
  <div class="messageContent_harness" id="goodbox"><img class="emoji" data-type="emoji" data-id="999000" alt=":good_emote:" src="https://cdn.discordapp.com/emojis/999000.webp?size=44"></div>
  <button id="nativebtn">Discord 自己的按钮</button>

  <!-- 仿真表情面板: Discord 2026 把面板挂在 clickTrap 里, 点在面板外 = 关面板 -->
  <button id="emoji-trigger" aria-label="添加表情符号">😊</button>
  <div id="picker-trap" class="clickTrapContainer_aaa trapClicks_bbb" style="display:none">
    <div class="emojiPicker_ccc">
      <button id="lk1" data-type="emoji" data-id="1571550119483150561" data-animated="true" data-name="naijing_gif"><span class="emojiLockIcon_zzz"></span></button>
      <button id="fr1" data-type="emoji" data-id="1571549979754111046" data-animated="false" data-name="naijing">🙂</button>
    </div>
  </div>
</main>

<script>
/* ══════════════════════════════════════════════════════════════════
 * GM_* 打桩 —— 必须在 userscript 之前执行, 模拟 Tampermonkey 的运行环境。
 * 所有网络进出都落到本机 Node 静态服务器上 (见 run.js)。
 * ══════════════════════════════════════════════════════════════════ */
(function () {
  /* 预置配置: nsfwOnly=false 才走「全部混淆」, 让上传用例可确定地验证换体 */
  const seed = { 'moeguard.cfg': { enabled: true, autoDecode: true, badge: true, nsfwOnly: false, salt: '', tile: 0, maxDim: 0, skipAnimated: true, nsfwThreshold: 0.7, reviewMode: 'local' } };
  localStorage.setItem('__gmstore', JSON.stringify(seed));
  const store = JSON.parse(localStorage.getItem('__gmstore') || '{}');
  window.__gmStore = store;

  window.GM_getValue = (k, d) => (k in store ? store[k] : d);
  window.GM_setValue = (k, v) => { store[k] = v; localStorage.setItem('__gmstore', JSON.stringify(store)); };
  window.GM_registerMenuCommand = () => {};
  window.__gmDl = [];
  window.GM_download = (o) => { window.__gmDl.push({ url: String(o && o.url || ''), name: o && o.name }); };
  window.GM_getResourceURL = () => '';

  /* 跨域 URL 落到本机: https://<任意主机><path> → <path> */
  function localize(u) {
    try { return new URL(u, location.href).pathname + new URL(u, location.href).search; } catch (e) { return u; }
  }
  window.__gmXhrLog = [];
  window.GM_xmlhttpRequest = function (opt) {
    window.__gmXhrLog.push({ url: opt.url, method: opt.method || 'GET', range: opt.headers && opt.headers.Range });
    const init = { method: opt.method || 'GET', headers: opt.headers || {} };
    if (opt.data !== undefined) init.body = opt.data;
    fetch(localize(opt.url), init)
      .then(async (r) => {
        const buf = await r.arrayBuffer();
        let text = '';
        try { text = new TextDecoder().decode(buf); } catch (e) {}
        if (opt.onload) opt.onload({
          status: r.status,
          responseHeaders: 'content-type: ' + (r.headers.get('content-type') || 'application/octet-stream') + '\r\n',
          response: buf, responseText: text,
        });
      })
      .catch((e) => { if (opt.onerror) opt.onerror(e); });
  };

  /* XHR 打桩: 只记账, 不真发 —— 这样能被 hook 当成 origSend 包起来,
   * 于是「放行后的最终字节」原封不动落在 __net 里, 可以验货。 */
  window.__net = { requests: [], last: null };
  const oOpen = XMLHttpRequest.prototype.open;
  const oSet = XMLHttpRequest.prototype.setRequestHeader;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.__net = { method: String(m || '').toUpperCase(), url: String(u || ''), hdrs: {}, body: null };
    return oOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.setRequestHeader = function (k, v) {
    try { if (this.__net) this.__net.hdrs[String(k)] = String(v); } catch (e) {}
    return oSet.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function (body) {
    const rec = { method: this.__net && this.__net.method, url: this.__net && this.__net.url, hdrs: this.__net && this.__net.hdrs,
                  bytes: null, kind: body && body.constructor ? body.constructor.name : typeof body };
    if (body instanceof ArrayBuffer) rec.bytes = new Uint8Array(body);
    else if (ArrayBuffer.isView(body)) rec.bytes = new Uint8Array(body.buffer, body.byteOffset, body.byteLength);
    else if (body instanceof Blob) { rec.kind = 'Blob'; rec._blob = body; }
    window.__net.requests.push(rec);
    window.__net.last = rec;
    if (body instanceof Blob) body.arrayBuffer().then((b) => { rec.bytes = new Uint8Array(b); });
    try { this.dispatchEvent(new Event('load')); this.dispatchEvent(new Event('loadend')); } catch (e) {}
    this.readyState = 4; this.status = 200;
    if (this.onreadystatechange) { try { this.onreadystatechange(); } catch (e) {} }
  };
})();
</script>

<script src="/dist/moeguard.user.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════════
 * 验收用例 —— 全部对着真实浏览器跑, 不 mock canvas / PNG / DOM。
 * 结果 POST 回 run.js 打印。
 * ══════════════════════════════════════════════════════════════════ */
(async function () {
  /* ---------- 仿真 Discord 的 Slate 编辑行为 ----------
   * 真页上表情 chip 包在 <span data-slate-void="true" contenteditable="false"> 里,
   * Slate 自己听 beforeinput / paste。仿真台不照做这两件事,
   * 「输入栏里把 chip 换成短链」这条用例就是测空气。 */
  (function emulateSlate() {
    const box = document.getElementById('composer');
    if (!box) return;
    box.addEventListener('beforeinput', (e) => {
      if (e.inputType !== 'deleteContentBackward') return;
      e.preventDefault();
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const rg0 = sel.getRangeAt(0);
      if (!rg0.collapsed) { rg0.deleteContents(); return; }
      const n = rg0.startContainer, off = rg0.startOffset;
      if (n.nodeType === 1) { const v = n.childNodes[off - 1]; if (v) v.remove(); return; }
      if (off > 0) n.textContent = n.textContent.slice(0, off - 1) + n.textContent.slice(off);
    });
    box.addEventListener('paste', (e) => {
      const t = e.clipboardData ? e.clipboardData.getData('text/plain') : null;
      if (t == null) return;
      e.preventDefault();
      const sel = window.getSelection();
      let rg = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      if (rg && !box.contains(rg.startContainer)) rg = null;    // 选区跑外面 → 当末尾插
      const node = document.createTextNode(t);
      if (rg) { rg.deleteContents(); rg.insertNode(node); rg.setStartAfter(node); rg.collapse(true); sel.removeAllRanges(); sel.addRange(rg); }
      else box.appendChild(node);
    });
  })();

  window.addEventListener('error', (e) => {
    try { fetch('/log', { method: 'POST', body: 'ERR ' + (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || 0) }); } catch (er) {}
  });
  const results = [];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function ok(name, cond, extra) { results.push({ name, pass: !!cond, extra: extra === undefined ? '' : String(extra) }); }
  function report() { return fetch('/report', { method: 'POST', body: JSON.stringify(results) }); }

  /* 与 shim 的 readAll 同语义: 旧整包快照打底 + 每个键覆盖 */
  function gmCfg() {
    const st = window.__gmStore || {};
    const out = Object.assign({}, st['moeguard.cfg'] || {});
    const idx = st['moeguard.cfg.keys'] || [];
    for (const k of idx) if ((('moeguard.cfg.' + k) in st)) out[k] = st['moeguard.cfg.' + k];
    return out;
  }
  function paint(w, h, fn) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    fn(ctx, w, h);
    return c;
  }
  function canvasBlob(c, type) {
    return new Promise((res) => c.toBlob(res, type || 'image/png'));
  }
  const srcCanvas = paint(240, 180, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#ff9bd2'); g.addColorStop(1, '#7c6bf0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('MoeGuard', 20, 60);
    for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? '#22203a' : '#e8e2f5'; ctx.fillRect(16 + i * 16, 120, 10, 10); }
  });

  /* ---------- 1. 装载 ---------- */
  ok('脚本装载: core / format / review 三个全局都在',
    !!window.__MoeGuardCore && !!window._moeFormat && !!window.__MoeGuardReview);
  ok('注入世界 = page (hook 才有意义)', window.__moeWorld === 'page', window.__moeWorld);

  await sleep(600);   // 等 content.js 在 DOMContentLoaded 之后 boot

  /* ---------- 2. 面板 ---------- */
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'm', altKey: true, bubbles: true }));
  await sleep(200);
  const panel = document.getElementById('moe-panel');
  ok('Alt+M 打出面板', !!panel && panel.style.display !== 'none');
  const tabBtns = panel ? panel.querySelectorAll('.moe-tab') : [];
  ok('面板有 弹窗/设置 两个页签', tabBtns.length === 2, tabBtns.length);
  if (tabBtns[1]) tabBtns[1].click();
  await sleep(150);
  const settingsPane = panel && panel.querySelector('[data-pane="settings"]');
  ok('切到设置页签: 设置面板可见', !!settingsPane && !settingsPane.hidden);
  ok('设置页表单已由原 options.js 渲染',
    !!document.getElementById('cfg-salt') && !!document.getElementById('cfg-reviewMode'));

  const panelBg = getComputedStyle(panel).backgroundImage || '';
  ok('面板样式生效 (暗色渐变背景)', /linear-gradient/.test(panelBg), panelBg.slice(0, 44));
  const nativeBg = getComputedStyle(document.getElementById('nativebtn')).backgroundColor;
  ok('面板 CSS 没有污染页面自己的按钮', !/88, 101, 242|#5865f2/i.test(nativeBg), nativeBg);

  /* ---------- 3.1 面板 CSS 分页: 设置页不得被弹窗的 body{width:250px} 挤死 ---------- */
  const popupPane = panel.querySelector('[data-pane="popup"]');
  const setPane = panel.querySelector('[data-pane="settings"]');
  const setW = setPane.getBoundingClientRect().width;
  ok('设置页宽度 > 250px (没被弹窗 body 规则污染)', setW > 260, setW.toFixed(0) + 'px');
  const headBtn = panel.querySelector('.moe-head .moe-x');
  ok('外壳按钮没被 pane 的 button{width:100%} 洗掉',
    headBtn.getBoundingClientRect().width < 60, headBtn.getBoundingClientRect().width.toFixed(0) + 'px');

  /* ---------- 3. 算法往返测试 (走面板按钮, 即原 options.js 的代码) ---------- */
  document.getElementById('test').click();
  await sleep(1200);
  const verdict = document.getElementById('testVerdict');
  ok('面板「算法往返测试」出结论', !!verdict && /通过|一致/.test(verdict.textContent), verdict && verdict.textContent.slice(0, 60));
  ok('往返测试画出了混淆版预览', !!document.querySelector('#testWrap img'));

  /* ---------- 4. 上传拦截 (XHR, 挂起 → 按发送 → 换体) ---------- */
  const pngBlob = await canvasBlob(srcCanvas, 'image/png');
  const pngBytes = new Uint8Array(await pngBlob.arrayBuffer());
  const cfgSaved = window.GM_getValue('moeguard.cfg', {});
  window.GM_setValue('moeguard.cfg', Object.assign({}, cfgSaved, { enabled: true, nsfwOnly: false, salt: '', autoDecode: true }));
  await sleep(300);

  const x = new XMLHttpRequest();
  x.open('PUT', 'https://discord-attachments-uploads-prd.storage.googleapis.com/upload/storage/v1/b/x/o?uploadType=media');
  x.setRequestHeader('content-type', 'image/webp');
  x.send(pngBytes.buffer);
  await sleep(1500);
  const heldNotSent = window.__net.requests.length === 0;
  ok('上传被挂住 (未按发送前零流量)', heldNotSent, '已发 ' + window.__net.requests.length + ' 笔');

  document.getElementById('composer').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await sleep(2500);
  const sent = window.__net.last;
  ok('按 Enter 后放行且换了体', !!sent && !!sent.bytes && sent.bytes.length > 0,
    sent && sent.bytes ? (pngBytes.length + 'B → ' + sent.bytes.length + 'B') : 'no-body');

  let isMoeEncoded = false, rtOk = false;
  if (sent && sent.bytes) {
    const sBlob = new Blob([sent.bytes], { type: 'image/png' });
    const im = await window._moeFormat.blobToImageData(sBlob);
    const meta = window.__MoeGuardCore.detectMeta(im, '');
    isMoeEncoded = !!meta;
    const dec = window.__MoeGuardCore.decodeImage(im, { salt: '' });
    rtOk = !!(dec && dec.ok && dec.width === 240 && dec.height === 180);
  }
  ok('上传体带 moEg/moMt 标记 (是喵图)', isMoeEncoded);
  ok('上传体解码回原尺寸 240×180', rtOk);

  /* ---------- 5. 自动解码 (从「服务器」拉回刚才那张混淆图) ---------- */
  const encImg = await (async () => {
    const im = await window._moeFormat.blobToImageData(pngBlob);
    im.data = new Uint8ClampedArray(im.data);
    const enc = window.__MoeGuardCore.encodeImage(im, { salt: '' });
    const b = await window._moeFormat.encodedToBlob(enc, null);
    return b;
  })();
  await fetch('/upload?name=moe.png', { method: 'POST', body: encImg });
  const imgEl = document.getElementById('moeimg');
  imgEl.src = 'https://cdn.discordapp.com/attachments/1/2/moe.png?v=' + Date.now();
  await sleep(4000);   // 交给 content.js 自己的轮询扫描 (1200ms 一轮)
  const diagAttrs = (function () {
    const d = document.getElementById('__moe_diag');
    if (!d) return 'no-diag';
    return d.getAttributeNames().map((a) => a + '=' + d.getAttribute(a)).join(' | ').slice(0, 300);
  })();
  ok('消息流里的喵图被自动解码', imgEl.dataset.moeScan === 'decoded',
    'scan=' + imgEl.dataset.moeScan + ' keys=' + Object.keys(imgEl.dataset).join(',') + ' ‖ ' + diagAttrs);
  ok('解码后换成 blob: 原图', /^blob:/.test(String(imgEl.currentSrc || imgEl.src)), String(imgEl.currentSrc || imgEl.src).slice(0, 24));

  /* ---------- 5.5 「解码本页所有图片」重扫后仍然收敛 ---------- */
  document.getElementById('scan').click();
  await sleep(6000);
  ok('面板「解码本页所有图片」重扫后仍然是 decoded', imgEl.dataset.moeScan === 'decoded', 'scan=' + imgEl.dataset.moeScan);

  /* ---------- 5.6 遥测面板 (验证 shim 的 moe-dbg 通道) ---------- */
  document.getElementById('reattach').click();
  await sleep(600);
  const dbgTxt = (document.getElementById('dbg') || {}).textContent || '';
  ok('遥测面板显示已替换 >= 1', /已替换: [1-9]/.test(dbgTxt), dbgTxt.split('\n')[2] || dbgTxt.slice(0, 60));

  /* ---------- 6. 页内右键菜单 (用一张还没被解码的附件图) ---------- */
  const rawImg = document.getElementById('rawimg');
  const ctxEv = new MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, clientX: 120, clientY: 160 });
  rawImg.dispatchEvent(ctxEv);
  await sleep(200);
  const ctxEl = document.getElementById('moe-ctxmenu');
  ok('附件图右键弹出自己的菜单', !!ctxEl && ctxEv.defaultPrevented, ctxEl ? ctxEl.textContent.slice(0, 30) : 'none');

  const shiftEv = new MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, clientX: 120, clientY: 160, shiftKey: true });
  if (document.getElementById('moe-ctxmenu')) document.getElementById('moe-ctxmenu').remove();
  rawImg.dispatchEvent(shiftEv);
  await sleep(100);
  ok('Shift+右键放行给 Discord 原生菜单', !shiftEv.defaultPrevented);

  /* ---------- 6.1 下载必须走 GM_download (不吃用户激活限制) ---------- */
  if (document.getElementById('moe-ctxmenu')) document.getElementById('moe-ctxmenu').remove();
  rawImg.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, clientX: 120, clientY: 160 }));
  await sleep(150);
  const dlItems = document.querySelectorAll('#moe-ctxmenu div');
  if (dlItems[1]) {
    dlItems[1].click();            // 「💾 另存此图」
    await sleep(600);
    const last = window.__gmDl[window.__gmDl.length - 1];
    ok('下载走 GM_download (不靠合成点击)', !!last && /attachments/.test(last.url), last ? last.name + ' ← ' + last.url.slice(0, 34) : 'none');
  } else ok('下载走 GM_download (不靠合成点击)', false, '菜单项数=' + dlItems.length);

  /* ---------- 7. 开关写入 + 跨页不串台 (切页重读) ---------- */
  const autoChk = document.getElementById('t-autoDecode');
  if (autoChk) {
    autoChk.checked = false;
    autoChk.dispatchEvent(new Event('change'));
    await sleep(300);
    const saved = gmCfg();
    ok('弹窗开关写进 GM 存储', saved.autoDecode === false, JSON.stringify(saved).slice(0, 60));

    /* 从设置页看过去应该已是关的 (切页重读生效) */
    panel.querySelector('[data-tab="settings"]').click();
    await sleep(250);
    ok('补丁: 切到设置页时重读了配置 (不拿旧值覆盖)',
      document.getElementById('cfg-autoDecode').checked === false,
      'cfg-autoDecode=' + document.getElementById('cfg-autoDecode').checked);
    panel.querySelector('[data-tab="popup"]').click();
    await sleep(250);

    autoChk.checked = true;
    autoChk.dispatchEvent(new Event('change'));
    await sleep(200);
  } else ok('弹窗开关写进 GM 存储', false, '找不到 t-autoDecode');

  /* ---------- 7.1 已解码的 blob 图也能右出菜单 (data-moe-orig 回落) ---------- */
  if (document.getElementById('moe-ctxmenu')) document.getElementById('moe-ctxmenu').remove();
  const decEv = new MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, clientX: 140, clientY: 180 });
  imgEl.dispatchEvent(decEv);
  await sleep(200);
  ok('补丁: 已解码(blob:)的附件图右键仍有自己的菜单',
    !!document.getElementById('moe-ctxmenu') && decEv.defaultPrevented,
    'moeOrig=' + String(imgEl.dataset.moeOrig || '').slice(0, 30));

  /* ---------- 8. 诊断 ---------- */
  const dbg = await new Promise((res) => {
    try {
      // content.js 的内部监听器只认 dispatchToContent —— 用面板按钮等价路径已覆盖,
      // 这里直接读遥测对象
      res(window.__moeDbgSnapshot ? window.__moeDbgSnapshot() : null);
    } catch (e) { res(null); }
  });
  ok('(信息) 遥测快照', true, dbg ? JSON.stringify(dbg).slice(0, 120) : 'n/a');

  /* ---------- 9. 补丁②: 预处理期 abort 不得幽灵上传 ---------- */
  const beforeAbort = window.__net.requests.length;
  const xa = new XMLHttpRequest();
  xa.open('PUT', 'https://discord-attachments-uploads-prd.storage.googleapis.com/upload/storage/v1/b/x/o?uploadType=media');
  xa.send(pngBytes.buffer);
  xa.abort();                       // 同一 tick 内取消 (bodyToU8 还没 resolve)
  await sleep(2500);
  ok('补丁②: 预处理期 abort → 零流量 (不会幽灵上传)',
    window.__net.requests.length === beforeAbort,
    '新增 ' + (window.__net.requests.length - beforeAbort) + ' 笔');

  /* ---------- 10. 补丁①: 意图早于入队 → 立即放行, 不干等 45s TTL ---------- */
  const beforeLate = window.__net.requests.length;
  const xb = new XMLHttpRequest();
  xb.open('PUT', 'https://discord-attachments-uploads-prd.storage.googleapis.com/upload/storage/v1/b/x/o?uploadType=media');
  xb.send(pngBytes.buffer);
  // 同一 tick 就按发送: 此刻 held 还是空的, 上游会丢弃这条意图 → 只能等 45s
  document.getElementById('composer').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await sleep(3000);
  ok('补丁①: 意图早于入队 → 3s 内已放行',
    window.__net.requests.length > beforeLate,
    '新增 ' + (window.__net.requests.length - beforeLate) + ' 笔');

  /* ---------- 11. 表情面板: 接手后关面板 + 发短链接 ---------- */
  const trap = document.getElementById('picker-trap');
  const trg = document.getElementById('emoji-trigger');
  const lk1 = document.getElementById('lk1');
  const fr1 = document.getElementById('fr1');
  const cbox = document.getElementById('composer');
  const pickerOpen = () => trap.style.display !== 'none';
  trg.addEventListener('click', () => { trap.style.display = pickerOpen() ? 'none' : ''; });
  /* Discord 的 clickTrap: 点在面板外 → 关 */
  trap.addEventListener('mousedown', (e) => { if (e.target === trap) trap.style.display = 'none'; });

  cbox.focus();
  trap.style.display = '';
  lk1.click();
  await sleep(500);
  const cTxt = cbox.textContent;
  ok('被锁动图 → 插 [. ](短链接) 而不是裸 URL',
    /\[\. \]\(https:\/\/cdn\.discordapp\.com\/emojis\/1571550119483150561\.gif\?size=96\)/.test(cTxt),
    cTxt.slice(-70));
  ok('接手后表情面板自动关闭 (与原生一致)', !pickerOpen(), 'open=' + pickerOpen());

  /* Shift 连着挑 → 面板留着 */
  trap.style.display = '';
  cbox.focus();
  lk1.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, shiftKey: true }));
  await sleep(500);
  ok('Shift+点 → 面板不关 (跟原生一样留着连续挑)', pickerOpen(), 'open=' + pickerOpen());
  trap.style.display = 'none';

  /* 没锁的表情 → 完全不接手, 交回 Discord 原生 */
  const before2 = cbox.textContent;
  trap.style.display = '';
  cbox.focus();
  fr1.click();
  await sleep(500);
  ok('没锁的表情不接手 (不插链接也不关面板)', cbox.textContent === before2,
    (cbox.textContent === before2 ? 'ok' : cbox.textContent.slice(-50)) + ' hijack=' + (document.getElementById('__moe_diag') || { dataset: {} }).dataset.hijack);

  /* ---------- 12. 外服表情: 输入栏里的 chip 就地换成短链 ---------- */
  const ui12 = window.__MoeUI || {};
  if (ui12.scanEmojiRender) ui12.scanEmojiRender();     // 先消除时序抖动
  ok('学到「渲染成字面文本」的表情名 → broken 名单',
    (ui12.emo || { broken: [] }).broken.indexOf('bad_emote') >= 0,
    JSON.stringify((ui12.emo || {}).broken));
  ok('学到「渲染成图」的表情名 → good 名单 (永不接手)',
    (ui12.emo || { good: [] }).good.indexOf('good_emote') >= 0,
    JSON.stringify((ui12.emo || {}).good));

  const cbox2 = document.getElementById('composer');
  cbox2.innerHTML = '';
  const put = (s) => cbox2.appendChild(document.createTextNode(s));
  const mkChip = (id, name) => {
    const im = document.createElement('img');
    im.className = 'emoji';
    im.setAttribute('data-type', 'emoji');
    im.setAttribute('data-id', id);
    im.setAttribute('alt', ':' + name + ':');
    im.src = 'https://cdn.discordapp.com/emojis/' + id + '.webp?size=44';
    cbox2.appendChild(im);
    return im;
  };
  /* 文字 + 不可用 + 文字 + 可用 + 文字 + 不可用 + 文字 —— 多张叠着也要各自就位 */
  put('甲'); const badChip = mkChip('1397468110776172654', 'bad_emote');
  put('乙'); const goodChip = mkChip('999000', 'good_emote');
  put('丙'); const badChip2 = mkChip('1397468110776172655', 'bad_emote2');
  put('丁');
  cbox2.focus();
  await sleep(5000);                       // 等 loop 跑几轮 (每轮串行换一张)
  const txt12 = cbox2.textContent;
  ok('两张不可用的 chip 都被拿掉 (多张叠加也正常)',
    !badChip.isConnected && !badChip2.isConnected,
    'b1=' + badChip.isConnected + ' b2=' + badChip2.isConnected);
  ok('可用的那张原样留着 (没误伤)', cbox2.contains(goodChip), 'good 还在=' + cbox2.contains(goodChip));
  const L1 = '[. ](https://cdn.discordapp.com/emojis/1397468110776172654.webp?size=96)';
  const L2 = '[. ](https://cdn.discordapp.com/emojis/1397468110776172655.webp?size=96)';
  ok('第一张换在自己的位置上',
    txt12.indexOf('甲') >= 0 && txt12.indexOf(L1) > txt12.indexOf('甲') && txt12.indexOf('乙') > txt12.indexOf(L1),
    txt12);
  ok('第二张换在自己的位置上',
    txt12.indexOf(L2) > txt12.indexOf('乙') && txt12.indexOf('丁') > txt12.indexOf(L2), txt12);
  ok('原有文字没被整体覆盖', ['甲', '乙', '丙', '丁'].every((x) => txt12.indexOf(x) >= 0), txt12);

  /* 防刷屏: 再插一张同一个表情 → 应该只多一个链接, 不能每 1.2s 重贴一次 */
  const cnt = (s, sub) => s.split(sub).length - 1;
  put('戊'); const again3 = mkChip('1397468110776172654', 'bad_emote');
  cbox2.focus();
  await sleep(4000);
  const txt13 = cbox2.textContent;
  ok('同一表情再插一次只多一个链接 (不会每轮重贴刷屏)',
    cnt(txt13, L1) === 2 && !again3.isConnected,
    'L1 个数=' + cnt(txt13, L1) + ' chip 还在=' + again3.isConnected);

  /* ---------- 13. 网关判据: 全部外服表情/贴纸通杀 ----------
   * 前面那几段靠「在滞动条里见过它渲染成字面文本」, 这一段验的是新根:
   * hook.js 从网关 GUILD_CREATE 里拿到「我加入的服务器的 emojis[]/stickers[]」,
   * 不在这个集合里的就是外服 —— 哪怕这个表情以前从没见过。
   * 做法: 直接拿 JSON.parse 喂两条 dispatch (探针在页面 JSON.parse 上)。
   */
  const GW_MY_EMOJI = '1600000000000000001';       // 我服的
  const GW_FAR_EMOJI = '1600000000000000002';      // 别服的, 本机任何名单里都没出现过
  const GW_MY_STICKER = '1600000000000000003';
  const GW_FAR_STICKER = '1600000000000000004';
  window.__gwRaw = [];
  window.__moeMsgs = 0;
  window.addEventListener('message', (ev) => {
    const d = ev && ev.data;
    if (!d || d.__moe !== 1) return;
    window.__moeMsgs++;
    if (d.gw === 1) window.__gwRaw.push(JSON.stringify({ own: (d.own || []).length, settled: d.settled, stats: d.stats }));
    if (d.gwq === 1) window.__gwRaw.push('Q:' + d.kind + ':' + d.ids.length);
  }, true);
  JSON.parse(JSON.stringify({ op: 0, t: 'READY', d: { user: { premium_type: 0 }, guilds: [{ id: '1' }] } }));
  JSON.parse(JSON.stringify({
    op: 0, t: 'GUILD_CREATE',
    d: { id: '1', emojis: [{ id: GW_MY_EMOJI, name: 'gw_my' }], stickers: [{ id: GW_MY_STICKER, name: 'gw_my_s' }] },
  }));
  await sleep(3600);                                  // 洪峰收尾条件: READY 到了且 3s 没新 GUILD_CREATE
  const ui13 = window.__MoeUI || {};
  /* ① 输入栏 chip: 没见过的外服表情也转 (不靠学习), 自家服务器的不误伤 */
  const cbox13 = document.getElementById('composer');
  cbox13.innerHTML = '';
  const farChip = mkChip(GW_FAR_EMOJI, 'gw_never_seen');
  const myChip = mkChip(GW_MY_EMOJI, 'gw_my');
  cbox13.focus();
  await sleep(5200);                                  // 暖一轮 + 转一轮
  const st13 = (ui13.emo || {}).gw || {};
  const gwDirect = window.__moeGw ? {
    g: window.__moeGw.guilds, e: window.__moeGw.emoji, s: window.__moeGw.sticker,
    p: window.__moeGw.premium, settled: window.__moeGw.settled,
  } : 'hook 没标 __moeGw';
  ok('hook.js 的网关探针从 GUILD_CREATE 里 harvested 到集合',
    st13.g === 1 && st13.e === 1 && st13.s === 1 && (ui13.emo || {}).settled === true,
    'content侧 ' + JSON.stringify(st13) + ' settled=' + (ui13.emo || {}).settled +
    ' | hook侧 ' + JSON.stringify(gwDirect) + ' | 原始回包 ' + (window.__gwRaw || []).slice(-3).join(' ;; ') + ' __moe消息总数=' + window.__moeMsgs + ' cached=' + (ui13.emo || {}).cached);
  // 读完打印后不再用
  ok('诊断面板 data-gw 把集合报出来了',
    /g=1 e=1 s=1/.test((document.getElementById('__moe_diag') || { dataset: {} }).dataset.gw || ''),
    (document.getElementById('__moe_diag') || { dataset: {} }).dataset.gw);

  ok('【通杀】从未在任何名单里出现过的外服表情 → 输入栏里就转成链',
    !farChip.isConnected && cbox13.textContent.indexOf('[. ](https://cdn.discordapp.com/emojis/' + GW_FAR_EMOJI + '.webp?size=96)') >= 0,
    cbox13.textContent.slice(0, 120));
  ok('自家服务器的表情 (在 GUILD_CREATE.emojis[] 里) 不转',
    cbox13.contains(myChip), 'my 还在=' + cbox13.contains(myChip));

  /* ② 表情面板: 没有任何锁标记的外服表情, 点一下也接手 */
  const trap13 = document.getElementById('picker-trap');
  const grid13 = trap13.querySelector('.emojiPicker_ccc');
  const mkTile = (id, name, animated) => {
    const b = document.createElement('button');
    b.setAttribute('data-type', 'emoji');
    b.dataset.id = id; b.dataset.name = name;
    b.setAttribute('data-animated', animated ? 'true' : 'false');
    grid13.appendChild(b);
    return b;
  };
  const farTile = mkTile(GW_FAR_EMOJI + '9', 'gw_far_tile', false);   // 无锁/无 aria-disabled
  const myTile = mkTile(GW_MY_EMOJI, 'gw_my', false);
  ui13.gwWarmAll();
  await sleep(1200);                                   // 等暖缓存回包 (同步结论要用)
  ok('面板格子的结论能同步查到 (own / foreign)',
    ui13.gwState('emoji', GW_MY_EMOJI) === 'own' && ui13.gwState('emoji', GW_FAR_EMOJI + '9') === 'foreign',
    ui13.gwState('emoji', GW_MY_EMOJI) + '/' + ui13.gwState('emoji', GW_FAR_EMOJI + '9'));
  const before13 = cbox13.textContent;
  cbox13.focus();
  farTile.click();
  await sleep(600);
  ok('【通杀】无锁标记的外服表情点一下 → 接手插链 (旧版必须 Discord 标锁)',
    cbox13.textContent !== before13 &&
    /\[\. \]\(https:\/\/cdn\.discordapp\.com\/emojis\//.test(cbox13.textContent.slice(before13.length)),
    JSON.stringify(cbox13.textContent.slice(before13.length, before13.length + 90)));
  const b14 = cbox13.textContent;
  myTile.click();
  await sleep(400);
  ok('自家服务器的表情格子不接手 (交回 Discord 原生)', cbox13.textContent === b14,
    JSON.stringify(cbox13.textContent.slice(b14.length, b14.length + 60)));

  /* ③ 贴纸面板: 没有任何 unsendable 标记的外服贴纸也接手 + 复制钮 */
  Object.defineProperty(navigator, 'clipboard', { configurable: true, value: {
    writeText: (t) => { window.__copyLog = window.__copyLog || []; window.__copyLog.push(t); return Promise.resolve(); },
  } });
  const sArea = document.createElement('div');
  /* 形状跟真 Discord 一致: 贴纸格 [data-type=sticker][data-id] 里面包 stickerNode */
  const GW_SEEN_STICKER = '1600000000000000005';    // 外服, 但消息里见过它渲染成图
  document.getElementById('litbox').innerHTML =
    '<span>:gw_seen_s_emote:</span><img src="https://media.discordapp.net/stickers/' + GW_SEEN_STICKER + '.png?size=160">';
  sArea.innerHTML =
    '<div class="row_harness">' +
    '<div id="sFar" data-type="sticker" data-id="' + GW_FAR_STICKER + '" data-format-type="1"><div class="stickerNode_harness"></div></div>' +
    '<div id="sMy" data-type="sticker" data-id="' + GW_MY_STICKER + '" data-format-type="1"><div class="stickerNode_harness"></div></div>' +
    '<div id="sSeen" data-type="sticker" data-id="' + GW_SEEN_STICKER + '" data-format-type="1"><div class="stickerNode_harness"></div></div>' +
    '</div>';
  document.body.appendChild(sArea);
  ui13.gwWarmAll();
  await sleep(2600);                                    // 等 addCopyButtons 跑一轮
  const sFar = document.getElementById('sFar');
  const sMy = document.getElementById('sMy');
  const sSeen = document.getElementById('sSeen');
  ui13.scanEmojiRender();                                // 把 stGood 证据拾进来
  ok('贴纸的 veto 证据能从消息里学到 (渲染成过图的 id)',
    ((ui13.emo || {}).stickers || []).indexOf(GW_SEEN_STICKER) >= 0,
    JSON.stringify((ui13.emo || {}).stickers));
  await sleep(2600);                                    // 等 addCopyButtons 跑一轮
  const pill = sFar.querySelector('.moe-copy');
  ok('【贴纸复制钮】贴纸格上长出了 🔗 (Discord 自己没这个入口)', !!pill,
    'pill=' + (pill ? pill.getAttribute('data-moe-url') : 'none'));
  if (pill) {
    window.__copyLog = [];
    const b15 = cbox13.textContent;
    pill.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    await sleep(400);
    const copied = (window.__copyLog || [])[0] || '';
    ok('点它复制的就是 [. ](贴纸图链) 格式',
      copied === '[. ](https://media.discordapp.net/stickers/' + GW_FAR_STICKER + '.png?size=160)',
      JSON.stringify(copied));
    ok('点复制钮不会顺手把贴纸插进输入栏', cbox13.textContent === b15,
      JSON.stringify(cbox13.textContent.slice(b15.length, b15.length + 60)));
    ok('复制完钮会变 ✓', pill.getAttribute('data-moe-copy') === 'done', pill.textContent);
  }
  const b16 = cbox13.textContent;
  sFar.click();
  await sleep(600);
  ok('【通杀】没标 unsendable 的外服贴纸点一下也接手 (贴纸也全覆盖)',
    cbox13.textContent !== b16 && /stickers\//.test(cbox13.textContent.slice(b16.length)),
    JSON.stringify(cbox13.textContent.slice(b16.length, b16.length + 90)));
  const b17 = cbox13.textContent;
  sMy.click();
  await sleep(400);
  ok('自家服务器的贴纸 (在 GUILD_CREATE.stickers[] 里) 不接手', cbox13.textContent === b17,
    JSON.stringify(cbox13.textContent.slice(b17.length, b17.length + 60)));
  const b18 = cbox13.textContent;
  sSeen.click();
  await sleep(400);
  ok('外服但消息里渲染成过图的贴纸 → stGood 挡住, 不误伤', cbox13.textContent === b18,
    JSON.stringify(cbox13.textContent.slice(b18.length, b18.length + 60)));

  await report();
})();
</script>
</body>
</html>
